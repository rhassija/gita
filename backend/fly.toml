# fly.toml app configuration file generated for antarjyoti-backend on 2026-05-23T14:37:59-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'antarjyoti-backend'
primary_region = 'iad'

[build]

[env]
  CHROMA_DB_DIR = "/data"
  LLM_PROVIDER = "gemini"
  EMBEDDING_PROVIDER = "gemini"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  source = "chroma_data"
  destination = "/data"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
